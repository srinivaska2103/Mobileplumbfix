<!DOCTYPE html>
<html lang="en" dir="ltr" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%237C3AED' d='M224 96l16 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-16 0c-17.7 0-32 14.3-32 32s14.3 32 32 32zM128 160c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160c0 17.7 14.3 32 32 32l32 0 0 48c0 17.7 14.3 32 32 32s32-14.3 32-32l0-48 112 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-128zm352 32l-128 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l128 0c17.7 0 32-14.3 32-32s-14.3-32-32-32z'/></svg>">
    <title>404 - Page Not Found | PlumbFix 24/7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6b21a8', 
                        secondary: '#9333ea',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-300 overflow-hidden">

    <header class="fixed top-0 w-full z-50 px-4 py-4 md:px-8 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="p-2 bg-primary rounded-lg text-white group-hover:rotate-12 transition-transform">
                <i class="fas fa-faucet-drip text-xl"></i>
            </div>
                    <span class="text-2xl font-bold text-primary dark:text-purple-400">PlumbFix</span>
        </a>

        <div class="flex items-center gap-2">
            <button onclick="toggleDirection()" class="p-2 w-10 h-10 md:w-12 md:h-12 rounded-xl bg-gray-50 dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-center hover:border-primary transition-all">
                <span id="dir-text" class="text-[10px] font-black uppercase">LTR</span>
            </button>
            <button onclick="toggleTheme()" class="p-2 w-10 h-10 md:w-12 md:h-12 rounded-xl bg-gray-50 dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-center hover:border-primary transition-all text-primary dark:text-purple-400">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 relative">
        
        <div class="absolute inset-0 flex items-center justify-center z-0 opacity-10 dark:opacity-5">
            <i class="fas fa-droplet text-[20rem] md:text-[40rem] animate-pulse text-primary"></i>
        </div>

        <div class="relative z-10 text-center max-w-2xl space-y-8 animate-in fade-in zoom-in duration-700">
            
            <div class="relative inline-block">
                <h1 class="text-[10rem] md:text-[15rem] font-black leading-none text-gray-100 dark:text-gray-900 select-none">404</h1>
                <div class="absolute inset-0 flex flex-col items-center justify-center pt-8">
                    <i class="fas fa-pipe-section text-6xl md:text-8xl text-primary animate-bounce mb-4"></i>
                    <p class="bg-primary text-white px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">Pipe Burst!</p>
                </div>
            </div>

            <div class="space-y-4 px-4">
                <h2 class="text-3xl md:text-5xl font-black text-gray-900 dark:text-white">Oops! This link is leaking.</h2>
                <p class="text-gray-500 dark:text-gray-400 text-lg md:text-xl font-medium max-w-md mx-auto">
                    The page you are looking for has been washed away or never existed in our plumbing system.
                </p>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="index.html" class="w-full sm:w-auto bg-primary hover:bg-secondary text-white px-10 py-5 rounded-2xl font-black text-lg shadow-xl shadow-purple-200 dark:shadow-none transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-house"></i> Back to Home
                </a>
                <a href="contact.html" class="w-full sm:w-auto bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 text-gray-700 dark:text-gray-300 px-10 py-5 rounded-2xl font-black text-lg hover:border-primary hover:text-primary transition-all flex items-center justify-center gap-3">
                    Report Issue <i class="fas fa-wrench"></i>
                </a>
            </div>

            
        </div>
    </main>

    <script>
        // --- Dark/Light Mode ---
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        // --- LTR/RTL ---
        function toggleDirection() {
            const html = document.getElementById('main-html');
            const dirText = document.getElementById('dir-text');
            const newDir = html.dir === 'ltr' ? 'rtl' : 'ltr';
            html.dir = newDir;
            dirText.innerText = newDir.toUpperCase();
            localStorage.setItem('dir', newDir);
        }

        // --- Persistence Logic ---
        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            }
            if (localStorage.getItem('dir')) {
                const storedDir = localStorage.getItem('dir');
                document.getElementById('main-html').dir = storedDir;
                document.getElementById('dir-text').innerText = storedDir.toUpperCase();
            }
        };
    </script>
</body>
</html>
