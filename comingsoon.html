<!DOCTYPE html>
<html lang="en" dir="ltr" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%237C3AED' d='M224 96l16 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-16 0c-17.7 0-32 14.3-32 32s14.3 32 32 32zM128 160c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160c0 17.7 14.3 32 32 32l32 0 0 48c0 17.7 14.3 32 32 32s32-14.3 32-32l0-48 112 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-128zm352 32l-128 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l128 0c17.7 0 32-14.3 32-32s-14.3-32-32-32z'/></svg>">
    <title>Launching Soon | PlumbFix 24/7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6b21a8', 
                        secondary: '#9333ea',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">

    <header class="fixed top-0 w-full z-50 px-4 py-4 md:px-8 flex justify-between items-center bg-white/80 dark:bg-gray-950/80 backdrop-blur-md">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="p-2 bg-primary rounded-lg text-white group-hover:scale-110 transition-transform">
                <i class="fas fa-faucet-drip text-lg md:text-xl"></i>
            </div>
                    <span class="text-2xl font-bold text-primary dark:text-purple-400">PlumbFix</span>
        </a>

        <div class="flex items-center gap-2">
            <button onclick="toggleDirection()" class="p-2 w-9 h-9 md:w-12 md:h-12 rounded-xl bg-gray-100 dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-center hover:border-primary transition-all">
                <span id="dir-text" class="text-[9px] md:text-[10px] font-black uppercase">LTR</span>
            </button>
            <button onclick="toggleTheme()" class="p-2 w-9 h-9 md:w-12 md:h-12 rounded-xl bg-gray-100 dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-center hover:border-primary transition-all text-primary dark:text-purple-400">
                <i id="theme-icon" class="fas fa-moon text-xs md:text-base"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12 relative overflow-hidden">
        
        <div class="absolute top-1/4 left-1/4 w-48 h-48 md:w-64 md:h-64 bg-primary/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 md:w-96 md:h-96 bg-secondary/10 rounded-full blur-3xl animate-pulse delay-700"></div>

        <div class="relative z-10 text-center max-w-3xl space-y-8 md:space-y-12">
            
            <div class="inline-flex items-center gap-2 bg-purple-50 dark:bg-purple-900/30 text-primary dark:text-purple-300 px-3 py-1.5 md:px-4 md:py-2 rounded-full font-bold text-[10px] md:text-xs uppercase tracking-widest border border-purple-100 dark:border-purple-800">
                <i class="fas fa-rocket animate-bounce"></i> Launching Soon
            </div>

            <div class="space-y-3 md:space-y-4">
                <h1 class="text-3xl sm:text-4xl md:text-7xl font-semibold text-gray-900 dark:text-white leading-[1.1] tracking-tight">
                    Upgrading Your <br> <span class="text-primary">Home Experience</span>
                </h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm md:text-xl font-medium max-w-md md:max-w-xl mx-auto px-2">
                    Our smart booking platform is almost ready. Get 1-click plumbing support and live tracking soon.
                </p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 max-w-[280px] md:max-w-lg mx-auto">
                <div class="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 rounded-2xl md:rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                    <span class="block text-2xl md:text-4xl font-black text-primary">14</span>
                    <span class="text-[8px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Days</span>
                </div>
                <div class="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 rounded-2xl md:rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                    <span class="block text-2xl md:text-4xl font-black text-primary">08</span>
                    <span class="text-[8px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Hours</span>
                </div>
                <div class="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 rounded-2xl md:rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                    <span class="block text-2xl md:text-4xl font-black text-primary">42</span>
                    <span class="text-[8px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Mins</span>
                </div>
                <div class="bg-gray-50 dark:bg-gray-900 p-3 md:p-4 rounded-2xl md:rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm">
                    <span class="block text-2xl md:text-4xl font-black text-primary">15</span>
                    <span class="text-[8px] md:text-[10px] font-bold text-gray-400 uppercase tracking-widest">Secs</span>
                </div>
            </div>

            <form class="max-w-md mx-auto flex flex-col sm:relative group gap-3 sm:gap-0" onsubmit="return false;">
                <input type="email" placeholder="Email for early access" 
                    class="w-full pl-6 pr-6 sm:pr-36 py-4 md:py-5 rounded-2xl bg-white dark:bg-gray-900 border-2 border-gray-100 dark:border-gray-800 outline-none focus:border-primary transition-all font-bold shadow-lg dark:text-white text-sm md:text-base">
                <button class="sm:absolute right-2 top-2 bottom-2 bg-primary hover:bg-secondary text-white px-6 py-4 sm:py-0 rounded-xl font-black text-[10px] md:text-xs uppercase tracking-widest transition-all active:scale-95 shadow-lg shadow-primary/20">
                    Notify Me
                </a>
            </form>

            <div class="flex justify-center gap-5 md:gap-6 text-gray-400 text-lg md:text-xl">
                <a href="#" class="hover:text-primary transition-all hover:-translate-y-1"><i class="fab fa-facebook"></i></a>
                <a href="#" class="hover:text-primary transition-all hover:-translate-y-1"><i class="fab fa-x-twitter"></i></a>
                <a href="#" class="hover:text-primary transition-all hover:-translate-y-1"><i class="fab fa-instagram"></i></a>
                <a href="#" class="hover:text-primary transition-all hover:-translate-y-1"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </main>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('theme-icon');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function toggleDirection() {
            const html = document.getElementById('main-html');
            const dirText = document.getElementById('dir-text');
            const newDir = html.dir === 'ltr' ? 'rtl' : 'ltr';
            html.dir = newDir;
            dirText.innerText = newDir.toUpperCase();
            localStorage.setItem('dir', newDir);
        }

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            }
            if (localStorage.getItem('dir')) {
                const storedDir = localStorage.getItem('dir');
                document.getElementById('main-html').dir = storedDir;
                document.getElementById('dir-text').innerText = storedDir.toUpperCase();
            }
        };
    </script>
</body>
</html>
